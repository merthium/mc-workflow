# Dedicated MC shortcut bar; no user tmux configuration is loaded.
set -g default-terminal "screen-256color"
set -g status 2
set -g status-position bottom
set -g status-interval 0
set -g status-style "bg=default,fg=default"
set -g status-left ""
set -g status-right ""
set -g mouse on
set -g prefix None
set -g prefix2 None
unbind-key -q -a -T prefix
set -s escape-time 20
set -g history-limit 0
set -g set-titles off
set -g remain-on-exit off
set -g destroy-unattached off
set -s exit-empty on
set-hook -g client-detached 'send-keys -t = F20 F10'
set -g allow-rename off
set -g automatic-rename off
set -g status-format[1] ' #[range=user|Enter,bold]Enter#[nobold] Open#[norange]  #[range=user|BSpace,bold]Backspace#[nobold] Up#[norange]  #[range=user|Tab,bold]←/→#[nobold] Panel#[norange]  #[range=user|s,bold]S#[nobold] Select#[norange]  #[range=user|/,bold]/#[nobold] Search#[norange]  #[range=user|b,bold]B#[nobold] Bookmarks#[norange]  #[range=user|dot,bold].#[nobold] Hidden#[norange]'
set -g status-format[0] ' #[range=user|F1,bold]F1#[nobold] Help#[norange] #[range=user|F2,bold]F2#[nobold] Menu#[norange] #[range=user|F3,bold]F3#[nobold] View#[norange] #[range=user|F4,bold]F4#[nobold] Edit#[norange] #[range=user|F5,bold]F5#[nobold] Copy#[norange] #[range=user|F6,bold]F6#[nobold] Move#[norange] #[range=user|F7,bold]F7#[nobold] Mkdir#[norange] #[range=user|F8,bold]F8#[nobold] Delete#[norange] #[range=user|F9,bold]F9#[nobold] Menu#[norange] #[range=user|F10,bold]F10#[nobold] Quit#[norange]'
bind-key -n MouseDown1Status {
    if-shell -F '#{==:#{mouse_status_range},Enter}' { send-keys -t = Enter }
    if-shell -F '#{==:#{mouse_status_range},BSpace}' { send-keys -t = BSpace }
    if-shell -F '#{==:#{mouse_status_range},Tab}' { send-keys -t = Tab }
    if-shell -F '#{==:#{mouse_status_range},s}' { send-keys -t = s }
    if-shell -F '#{==:#{mouse_status_range},/}' { send-keys -t = / }
    if-shell -F '#{==:#{mouse_status_range},b}' { send-keys -t = b }
    if-shell -F '#{==:#{mouse_status_range},dot}' { send-keys -t = . }
    if-shell -F '#{==:#{mouse_status_range},F1}' { send-keys -t = F1 }
    if-shell -F '#{==:#{mouse_status_range},F2}' { send-keys -t = F2 }
    if-shell -F '#{==:#{mouse_status_range},F3}' { send-keys -t = F3 }
    if-shell -F '#{==:#{mouse_status_range},F4}' { send-keys -t = F4 }
    if-shell -F '#{==:#{mouse_status_range},F5}' { send-keys -t = F5 }
    if-shell -F '#{==:#{mouse_status_range},F6}' { send-keys -t = F6 }
    if-shell -F '#{==:#{mouse_status_range},F7}' { send-keys -t = F7 }
    if-shell -F '#{==:#{mouse_status_range},F8}' { send-keys -t = F8 }
    if-shell -F '#{==:#{mouse_status_range},F9}' { send-keys -t = F9 }
    if-shell -F '#{==:#{mouse_status_range},F10}' { send-keys -t = F10 }
}
