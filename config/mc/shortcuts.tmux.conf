# Dedicated MC shortcut bar; no user tmux configuration is loaded.
set -g default-terminal "screen-256color"
set -g status 3
set -g status-position bottom
set -g status-interval 0
set -g status-style "bg=default,fg=default"
set -g status-left ""
set -g status-right ""
set -g mouse on
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
set -s escape-time 20
set -g history-limit 0
set -g set-titles off
set -g remain-on-exit off
set -g destroy-unattached off
set -s exit-empty on
set-hook -g client-detached 'send-keys -t = F20 F10'
set -g allow-rename off
set -g automatic-rename off
set -g status-format[0] ' #[range=user|Space,bold]Space#[nobold] Menu#[norange]  #[range=user|C-Left,bold]Ctrl+←#[nobold] Up#[norange]  #[range=user|C-Right,bold]Ctrl+→#[nobold] Open#[norange]  #[range=user|Tab,bold]←/→#[nobold] Panel#[norange]  #[range=user|s,bold]S#[nobold] Select#[norange]  #[range=user|f,bold]F#[nobold] Find#[norange]  #[range=user|h,bold]H#[nobold] Help#[norange]'
set -g status-format[1] ' #[range=user|c,bold]C#[nobold] Copy#[norange]  #[range=user|m,bold]M#[nobold] Move#[norange]  #[range=user|r,bold]R#[nobold] Rename#[norange]  #[range=user|n,bold]N#[nobold] New#[norange]  #[range=user|d,bold]D#[nobold] Delete#[norange]  #[range=user|v,bold]V#[nobold] View#[norange]  #[range=user|e,bold]E#[nobold] Edit#[norange]  #[range=user|q,bold]Q#[nobold] Close menu#[norange]'
bind-key -n MouseDown1Status {
    if-shell -F '#{==:#{mouse_status_range},Home}' { send-keys -t = Home }
    if-shell -F '#{==:#{mouse_status_range},End}' { send-keys -t = End }
    if-shell -F '#{==:#{mouse_status_range},PPage}' { send-keys -t = PPage }
    if-shell -F '#{==:#{mouse_status_range},NPage}' { send-keys -t = NPage }
    if-shell -F '#{==:#{mouse_status_range},/}' { send-keys -t = / }
    if-shell -F '#{==:#{mouse_status_range},Space}' { send-keys -t = Space }
    if-shell -F '#{==:#{mouse_status_range},C-Left}' { send-keys -t = C-Left }
    if-shell -F '#{==:#{mouse_status_range},C-Right}' { send-keys -t = C-Right }
    if-shell -F '#{==:#{mouse_status_range},Tab}' { send-keys -t = Tab }
    if-shell -F '#{==:#{mouse_status_range},s}' { send-keys -t = s }
    if-shell -F '#{==:#{mouse_status_range},f}' { send-keys -t = f }
    if-shell -F '#{==:#{mouse_status_range},h}' { send-keys -t = h }
    if-shell -F '#{==:#{mouse_status_range},c}' { send-keys -t = c }
    if-shell -F '#{==:#{mouse_status_range},m}' { send-keys -t = m }
    if-shell -F '#{==:#{mouse_status_range},r}' { send-keys -t = r }
    if-shell -F '#{==:#{mouse_status_range},n}' { send-keys -t = n }
    if-shell -F '#{==:#{mouse_status_range},d}' { send-keys -t = d }
    if-shell -F '#{==:#{mouse_status_range},v}' { send-keys -t = v }
    if-shell -F '#{==:#{mouse_status_range},e}' { send-keys -t = e }
    if-shell -F '#{==:#{mouse_status_range},q}' { send-keys -t = q }
}

set -g status-format[2] ' #[range=user|Home,bold]Home#[nobold] First#[norange]  #[range=user|End,bold]End#[nobold] Last#[norange]  #[range=user|PPage,bold]PgUp#[nobold]/#[range=user|NPage,bold]PgDn#[nobold] Page#[norange]  #[range=user|/,bold]/#[nobold] Name search#[norange]  Ctrl+S Next match  Esc Cancel search  F2 Actions  B Bookmarks'
